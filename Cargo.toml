[package]
name = "safecast-core"
version = "0.1.0"
edition = "2024"
description = "Core library for SafeCast: MLS group helpers, key ratchet, keying granularities, RTP packets, SRTP sessions, reorder-capable receiver, network simulation, and per-sender authentication"

[workspace]
members = [
    "demo/auth-service",
    "demo/safecast-client",
]
exclude = ["third_party/openmls"]
resolver = "2"

[workspace.dependencies]
# OpenMLS crates (local paths)
openmls = { path = "third_party/openmls/openmls", features = ["test-utils"] }
openmls_rust_crypto = { path = "third_party/openmls/openmls_rust_crypto", features = ["test-utils"] }
openmls_basic_credential = { path = "third_party/openmls/basic_credential", features = ["clonable"] }
openmls_traits = { path = "third_party/openmls/traits" }

# OpenMLS Delivery Service library (types for DS interaction)
ds-lib = { path = "third_party/openmls/delivery-service/ds-lib" }

# SRTP (Rust bindings for libsrtp): our patched copy of the high-level `srtp`
# crate (vendored in third_party/srtp), which adds Session::inplace_rekey
# (wrapping the patched libsrtp's srtp_inplace_rekey). It builds against
# third_party/srtp2-sys, our patched copy of the low-level bindings, which
# bundles libsrtp v2.8.0 instead of v2.3.0 (v2.3.0 had a SET_TAG bug
# costing ~120 ns on every protect() call: see
# benches/encrypt_decrypt_asymmetry/) and adds
# srtp_inplace_rekey for the fine-grained frame/packet rekeying.
srtp = { path = "third_party/srtp" }
# Also a direct dependency of this package: its build script compiles
# benches/c/srtp_kdf.c (the SRTP KDF copied out of libsrtp's srtp.c),
# which includes the config.h generated while srtp2-sys builds libsrtp.
# The srtp2-sys build script exports that path as DEP_SRTP2_INCLUDE,
# and Cargo only passes it to crates that depend on srtp2-sys.
srtp2-sys = { path = "third_party/srtp2-sys" }

# HTTP server
actix-web = "4"
actix-rt = "2.0"

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }

# Utilities
hex = "0.4"
base64 = "0.22"
socket2 = { version = "0.5", features = ["all"] }
clap = { version = "4", features = ["derive"] }

[dependencies]
# seeded RNG for the network simulation (simulation::network): ChaCha so the same
# seed reproduces the same disturbed run
rand = "0.9"
rand_chacha = "0.9"

# TESLA primitives: HMAC-SHA256 for the chain and the baseline MAC,
# OpenSSL for the GMAC variant
hmac = "0.12"
sha2 = { version = "0.10", features = ["asm"] }
openssl = "0.10"

openmls = { workspace = true }
openmls_rust_crypto = { workspace = true }
openmls_basic_credential = { workspace = true }
openmls_traits = { workspace = true }
srtp = { workspace = true }
srtp2-sys = { workspace = true }
hex = { workspace = true }
serde_json = { workspace = true }

[build-dependencies]
cc = "1"
pkg-config = "0.3"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
clap = { workspace = true }

[[bench]]
name = "replay_protection"
path = "benches/replay_protection.rs"
harness = false

[[bench]]
name = "key_derivation"
path = "benches/key_derivation.rs"
harness = false

[[bench]]
name = "ratchet_step"
path = "benches/ratchet_step.rs"
harness = false

[[bench]]
name = "granularity_throughput_ideal"
path = "benches/granularity_throughput_ideal.rs"
harness = false

[[bench]]
name = "realistic_receiver"
path = "benches/realistic_receiver.rs"
harness = false

[[bench]]
name = "srtp_throughput"
path = "benches/srtp_throughput.rs"
harness = false

[[bench]]
name = "srtp_scaling"
path = "benches/fixed_cost_breakdown/srtp_scaling.rs"
harness = false

[[bench]]
name = "aes_gcm_baseline"
path = "benches/fixed_cost_breakdown/aes_gcm_baseline.rs"
harness = false

[[bench]]
name = "pep_throughput"
path = "benches/pep_throughput.rs"
harness = false

[[bench]]
name = "rekey"
path = "benches/rekey.rs"
harness = false

[[bench]]
name = "rekey_breakdown"
path = "benches/rekey_breakdown.rs"
harness = false

[[bench]]
name = "srtp_rtcp_interleaving"
path = "benches/srtp_rtcp_interleaving.rs"
harness = false

# Not a Criterion bench (it measures memory, not time), but declared as a
# bench target so it runs through the same `cargo bench --bench` interface.
[[bench]]
name = "memory_usage"
path = "benches/memory_usage.rs"
harness = false

# TESLA's per-packet cost on top of SRTP, both directions.
[[bench]]
name = "tesla_throughput"
path = "benches/tesla_throughput.rs"
harness = false
