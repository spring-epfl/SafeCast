[workspace]
members = [
    "crates/mls-srtp-core",
    "crates/auth-service",
    "crates/mls-srtp-client",
]
exclude = ["openmls"]
resolver = "2"

[workspace.dependencies]
# OpenMLS crates (local paths)
openmls = { path = "openmls/openmls", features = ["test-utils"] }
openmls_rust_crypto = { path = "openmls/openmls_rust_crypto", features = ["test-utils"] }
openmls_basic_credential = { path = "openmls/basic_credential", features = ["clonable"] }
openmls_traits = { path = "openmls/traits" }

# OpenMLS Delivery Service library (types for DS interaction)
ds-lib = { path = "openmls/delivery-service/ds-lib" }

# SRTP (Rust bindings for libsrtp)
srtp = "0.7"

# HTTP server
actix-web = "4"
actix-rt = "2.0"

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
hex = "0.4"
base64 = "0.22"
socket2 = { version = "0.5", features = ["all"] }
clap = { version = "4", features = ["derive"] }

# Overriding srtp2-sys with our fork that bundles libsrtp v2.8.0
# (original srtp2-sys bundled v2.3.0 which had a SET_TAG bug causing
# ~120 ns overhead on every protect() call: see
# crates/mls-srtp-core/benches/protect_unprotect_asymmetry/)
[patch.crates-io]
srtp2-sys = { git = "https://github.com/ArmanKolozyan/srtp2-sys.git" }
