[workspace]
members = [
    "crates/mls-srtp-core",
    "demo/auth-service",
    "demo/mls-srtp-client",
]
exclude = ["openmls"]
resolver = "2"

[workspace.dependencies]
# OpenMLS crates (local paths)
openmls = { path = "openmls/openmls", features = ["test-utils"] }
openmls_rust_crypto = { path = "openmls/openmls_rust_crypto", features = ["test-utils"] }
openmls_basic_credential = { path = "openmls/basic_credential", features = ["clonable"] }
openmls_traits = { path = "openmls/traits" }

# OpenMLS Delivery Service library (types for DS interaction)
ds-lib = { path = "openmls/delivery-service/ds-lib" }

# SRTP (Rust bindings for libsrtp): our patched copy of the high-level `srtp`
# crate (vendored in vendor/srtp), which adds Session::inplace_rekey
# (wrapping the patched libsrtp's srtp_inplace_rekey). It builds against
# vendor/srtp2-sys, our patched copy of the low-level bindings, which
# bundles libsrtp v2.8.0 instead of v2.3.0 (v2.3.0 had a SET_TAG bug
# costing ~120 ns on every protect() call: see
# crates/mls-srtp-core/benches/protect_unprotect_asymmetry/) and adds
# srtp_inplace_rekey for the fine-grained frame/packet rekeying.
srtp = { path = "vendor/srtp" }
# Also a dependency of mls-srtp-core: its build script compiles
# benches/c/srtp_kdf.c (the SRTP KDF copied out of libsrtp's srtp.c),
# which includes the config.h generated while srtp2-sys builds libsrtp.
# The srtp2-sys build script exports that path as DEP_SRTP2_INCLUDE,
# and Cargo only passes it to crates that depend on srtp2-sys (this one).
srtp2-sys = { path = "vendor/srtp2-sys" }

# HTTP server
actix-web = "4"
actix-rt = "2.0"

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }

# Utilities
hex = "0.4"
base64 = "0.22"
socket2 = { version = "0.5", features = ["all"] }
clap = { version = "4", features = ["derive"] }
