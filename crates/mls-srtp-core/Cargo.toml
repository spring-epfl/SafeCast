[package]
name = "mls-srtp-core"
version = "0.1.0"
edition = "2024"
description = "Core library for MLS-SRTP: MLS group helpers, RTP packets, SRTP sessions, DS client, multicast"

[dependencies]
# seeded RNG for the network simulation (sim::network): ChaCha so the same
# seed reproduces the same disturbed run
rand = "0.9"
rand_chacha = "0.9"
openmls = { workspace = true }
openmls_rust_crypto = { workspace = true }
openmls_basic_credential = { workspace = true }
openmls_traits = { workspace = true }
ds-lib = { workspace = true }
srtp = { workspace = true }
hex = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
socket2 = { workspace = true }

[build-dependencies]
cc = "1"
pkg-config = "0.3"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
clap = { workspace = true }
openssl = "0.10"

[[bin]]
name = "memory_usage"
path = "src/bin/memory_usage.rs"

[[bench]]
name = "replay_protection"
path = "benches/replay_protection.rs"
harness = false

[[bench]]
name = "key_derivation"
path = "benches/key_derivation.rs"
harness = false

[[bench]]
name = "ratchet_step"
path = "benches/ratchet_step.rs"
harness = false

[[bench]]
name = "granularity_throughput_ideal"
path = "benches/granularity_throughput_ideal.rs"
harness = false

[[bench]]
name = "realistic_receiver"
path = "benches/realistic_receiver.rs"
harness = false

[[bench]]
name = "srtp_throughput_manual"
path = "benches/srtp_throughput/srtp_throughput_manual.rs"
harness = false

[[bench]]
name = "srtp_throughput_criterion"
path = "benches/srtp_throughput/srtp_throughput_criterion.rs"
harness = false

[[bench]]
name = "srtp_scaling"
path = "benches/payload_scaling/srtp_scaling.rs"
harness = false

[[bench]]
name = "aes_gcm_baseline"
path = "benches/payload_scaling/aes_gcm_baseline.rs"
harness = false

[[bench]]
name = "pep_throughput"
path = "benches/pep_throughput.rs"
harness = false

[[bench]]
name = "rekey"
path = "benches/rekey.rs"
harness = false

[[bench]]
name = "rekey_breakdown"
path = "benches/rekey_breakdown.rs"
harness = false

[[bench]]
name = "srtp_rtcp_interleaving"
path = "benches/srtp_rtcp_interleaving.rs"
harness = false
