[package]
name = "mls-srtp-core"
version = "0.1.0"
edition = "2024"
description = "Core library for MLS-SRTP: MLS group helpers, RTP packets, SRTP sessions, DS client, multicast"

[dependencies]
openmls = { workspace = true }
openmls_rust_crypto = { workspace = true }
openmls_basic_credential = { workspace = true }
openmls_traits = { workspace = true }
ds-lib = { workspace = true }
srtp = { workspace = true }
hex = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
socket2 = { workspace = true }

[build-dependencies]
cc = "1"
pkg-config = "0.3"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
clap = { workspace = true }
openssl = "0.10"

[[bench]]
name = "srtp_operations"
path = "benches/srtp_operations.rs"
harness = false

[[bench]]
name = "key_derivation"
path = "benches/key_derivation.rs"
harness = false

[[bench]]
name = "srtp_throughput_manual"
path = "benches/srtp_throughput/srtp_throughput_manual.rs"
harness = false

[[bench]]
name = "srtp_throughput_criterion"
path = "benches/srtp_throughput/srtp_throughput_criterion.rs"
harness = false

[[bench]]
name = "srtp_scaling"
path = "benches/payload_scaling/srtp_scaling.rs"
harness = false

[[bench]]
name = "aes_gcm_baseline"
path = "benches/payload_scaling/aes_gcm_baseline.rs"
harness = false

[[bench]]
name = "rekey"
path = "benches/rekey.rs"
harness = false
