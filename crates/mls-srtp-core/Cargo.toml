[package]
name = "mls-srtp-core"
version = "0.1.0"
edition = "2024"
description = "Core library for MLS-SRTP: MLS group helpers, RTP packets, SRTP sessions, DS client, multicast"

[dependencies]
openmls = { workspace = true }
openmls_rust_crypto = { workspace = true }
openmls_basic_credential = { workspace = true }
openmls_traits = { workspace = true }
ds-lib = { workspace = true }
srtp = { workspace = true }
hex = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
socket2 = { workspace = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
clap = { workspace = true }

[[bench]]
name = "srtp_benchmarks"
harness = false

[[bench]]
name = "srtp_throughput_manual"
harness = false

[[bench]]
name = "srtp_throughput_criterion"
harness = false
