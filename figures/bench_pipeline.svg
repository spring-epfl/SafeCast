<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -18 1190 328" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1190" height="310" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#555"/>
    </marker>
    <marker id="arrowgray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#555"/>
    </marker>
    <marker id="arrowlight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#999"/>
    </marker>
  </defs>

  <!-- ============ parameters, one arrow each ============ -->
  <g font-size="11.5" fill="#333">
    <text x="120" y="42" text-anchor="middle">payload size</text>

    <text x="390" y="42" text-anchor="middle">jitter</text>
    <text x="455" y="42" text-anchor="middle">loss</text>
    <text x="527" y="42" text-anchor="middle">path skew</text>
    <text x="612" y="42" text-anchor="middle">RNG seed</text>

    <text x="740" y="42" text-anchor="middle">key window</text>
    <text x="850" y="42" text-anchor="middle">seek cap</text>
    <text x="955" y="42" text-anchor="middle">replay window</text>
  </g>
  <g stroke="#555" stroke-dasharray="4 3">
    <line x1="120" y1="52" x2="120" y2="146" marker-end="url(#arrowgray)"/>

    <line x1="390" y1="52" x2="430" y2="146" marker-end="url(#arrowgray)"/>
    <line x1="455" y1="52" x2="458" y2="146" marker-end="url(#arrowgray)"/>
    <line x1="527" y1="52" x2="486" y2="146" marker-end="url(#arrowgray)"/>
    <line x1="612" y1="52" x2="514" y2="146" marker-end="url(#arrowgray)"/>

    <line x1="740" y1="52" x2="780" y2="146" marker-end="url(#arrowgray)"/>
    <line x1="850" y1="52" x2="825" y2="146" marker-end="url(#arrowgray)"/>
    <line x1="955" y1="52" x2="872" y2="146" marker-end="url(#arrowgray)"/>
  </g>

  <!-- the seed drives the two random quantities -->
  <g stroke="#999" stroke-width="1.2" fill="none">
    <path d="M 604 30 Q 534 6 466 30" marker-end="url(#arrowlight)"/>
    <path d="M 604 27 Q 498 -12 399 28" marker-end="url(#arrowlight)"/>
  </g>

  <!-- ============ pipeline ============ -->
  <rect x="20" y="150" width="200" height="80" rx="8" fill="#eaf2fa" stroke="#1f77b4" stroke-width="1.8"/>
  <text x="120" y="178" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f77b4">Sender</text>
  <text x="120" y="198" text-anchor="middle" font-size="10.5" fill="#333">(paced video stream, encrypted</text>
  <text x="120" y="212" text-anchor="middle" font-size="10.5" fill="#333">with per-generation keys)</text>

  <line x1="220" y1="190" x2="366" y2="190" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="293" y="208" text-anchor="middle" font-size="10" fill="#555">(p1, t1), (p2, t2), ...</text>
  <text x="293" y="222" text-anchor="middle" font-size="9.5" fill="#888">t1 &#60; t2 &#60; ...</text>
  <!-- encrypted packets, numbered, evenly paced -->
  <g>
    <rect x="244" y="156" width="20" height="20" rx="4" fill="#dbe9f8" stroke="#1f77b4"/>
    <rect x="270" y="156" width="20" height="20" rx="4" fill="#dbe9f8" stroke="#1f77b4"/>
    <rect x="296" y="156" width="20" height="20" rx="4" fill="#dbe9f8" stroke="#1f77b4"/>
    <rect x="322" y="156" width="20" height="20" rx="4" fill="#dbe9f8" stroke="#1f77b4"/>
    <g font-size="11" font-weight="bold" fill="#1f77b4" text-anchor="middle">
      <text x="254" y="170">1</text>
      <text x="280" y="170">2</text>
      <text x="306" y="170">3</text>
      <text x="332" y="170">4</text>
    </g>
  </g>

  <rect x="370" y="150" width="200" height="80" rx="8" fill="#fdecea" stroke="#e74c3c" stroke-width="1.8"/>
  <text x="470" y="178" text-anchor="middle" font-size="15" font-weight="bold" fill="#c0392b">Network</text>
  <text x="470" y="198" text-anchor="middle" font-size="10.5" fill="#333">(delays, drops, and</text>
  <text x="470" y="212" text-anchor="middle" font-size="10.5" fill="#333">reorders the packets)</text>

  <line x1="570" y1="190" x2="716" y2="190" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="643" y="208" text-anchor="middle" font-size="10" fill="#555">(p2, t2'), (p1, t1'), ...</text>
  <text x="643" y="222" text-anchor="middle" font-size="9.5" fill="#888">t2' &#60; t1' &#60; ...</text>
  <!-- the same packets, reordered by jitter, one lost -->
  <g>
    <rect x="590" y="156" width="20" height="20" rx="4" fill="#dbe9f8" stroke="#1f77b4"/>
    <rect x="616" y="156" width="20" height="20" rx="4" fill="#dbe9f8" stroke="#1f77b4"/>
    <rect x="642" y="156" width="20" height="20" rx="4" fill="none" stroke="#999" stroke-dasharray="3 2"/>
    <rect x="668" y="156" width="20" height="20" rx="4" fill="#dbe9f8" stroke="#1f77b4"/>
    <g font-size="11" font-weight="bold" text-anchor="middle">
      <text x="600" y="170" fill="#1f77b4">2</text>
      <text x="626" y="170" fill="#1f77b4">1</text>
      <text x="652" y="170" fill="#999">3</text>
      <text x="678" y="170" fill="#1f77b4">4</text>
    </g>
  </g>

  <rect x="720" y="150" width="210" height="80" rx="8" fill="#fdf3e7" stroke="#e67e22" stroke-width="2.6"/>
  <text x="815" y="178" text-anchor="middle" font-size="15" font-weight="bold" fill="#b9640f">Receiver</text>
  <!-- stopwatch -->
  <g stroke="#b9640f" fill="none" stroke-width="1.6">
    <circle cx="863" cy="173" r="7"/>
    <line x1="863" y1="164.5" x2="863" y2="162"/>
    <line x1="860.5" y1="162" x2="865.5" y2="162"/>
    <line x1="863" y1="173" x2="866.5" y2="169"/>
  </g>
  <text x="825" y="198" text-anchor="middle" font-size="10.5" fill="#333">(decrypts each arrival with its</text>
  <text x="825" y="212" text-anchor="middle" font-size="10.5" fill="#333">generation key: cache hit or derived)</text>

  <!-- ============ results ============ -->
  <g stroke="#555" stroke-width="1.6">
    <line x1="930" y1="183" x2="1010" y2="155" marker-end="url(#arrow)"/>
    <line x1="930" y1="197" x2="1010" y2="225" marker-end="url(#arrow)"/>
    <line x1="927" y1="248" x2="1010" y2="248" marker-end="url(#arrow)"/>
  </g>
  <g font-size="11.5" fill="#333">
    <text x="1018" y="159">latency percentiles</text>
    <text x="1018" y="229">throughput</text>
    <text x="1018" y="252">keying loss</text>
  </g>
  <!-- stats -->
  <line x1="885" y1="230" x2="885" y2="236" stroke="#e67e22" stroke-width="1.4"/>
  <rect x="845" y="236" width="80" height="24" rx="5" fill="#fdf3e7" stroke="#e67e22" stroke-width="1.4"/>
  <text x="885" y="252" text-anchor="middle" font-size="10" fill="#b9640f">stats</text>

  <!-- ============ ratchet seed & granularity ============ -->
  <rect x="385" y="254" width="180" height="34" rx="6" fill="#f8f9fa" stroke="#555" stroke-dasharray="5 3"/>
  <text x="475" y="275" text-anchor="middle" font-size="11.5" fill="#333">ratchet seed, granularity</text>
  <line x1="383" y1="271" x2="125" y2="234" stroke="#555" stroke-dasharray="4 3" marker-end="url(#arrowgray)"/>
  <line x1="567" y1="271" x2="820" y2="234" stroke="#555" stroke-dasharray="4 3" marker-end="url(#arrowgray)"/>
</svg>
