<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -14 1000 146" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="-14" width="1000" height="146" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#555"/>
    </marker>
    <marker id="arrowgray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#555"/>
    </marker>
    <marker id="arrowlight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#999"/>
    </marker>
  </defs>

  <!-- ============ input parameters, short arrows ============ -->
  <g font-size="12" fill="#333">
    <text x="100" y="14" text-anchor="middle">payload size</text>

    <text x="360" y="14" text-anchor="middle">jitter</text>
    <text x="410" y="14" text-anchor="middle">loss</text>
    <text x="466" y="14" text-anchor="middle">path skew</text>
    <text x="548" y="14" text-anchor="middle">RNG seed</text>

    <text x="708" y="14" text-anchor="middle">key window</text>
    <text x="800" y="14" text-anchor="middle">seek cap</text>
    <text x="882" y="14" text-anchor="middle">replay window</text>
  </g>
  <g stroke="#555" stroke-dasharray="4 3">
    <line x1="100" y1="20" x2="100" y2="40" marker-end="url(#arrowgray)"/>

    <line x1="360" y1="20" x2="392" y2="40" marker-end="url(#arrowgray)"/>
    <line x1="410" y1="20" x2="424" y2="40" marker-end="url(#arrowgray)"/>
    <line x1="466" y1="20" x2="456" y2="40" marker-end="url(#arrowgray)"/>
    <line x1="548" y1="20" x2="506" y2="40" marker-end="url(#arrowgray)"/>

    <line x1="708" y1="20" x2="740" y2="40" marker-end="url(#arrowgray)"/>
    <line x1="800" y1="20" x2="792" y2="40" marker-end="url(#arrowgray)"/>
    <line x1="882" y1="20" x2="846" y2="40" marker-end="url(#arrowgray)"/>
  </g>

  <!-- the RNG seed drives the two random quantities (jitter and loss): one smooth line diverging into two -->
  <g stroke="#999" stroke-width="1.1" fill="none">
    <path d="M 548 3 C 512 -8 468 -5 416 2" marker-end="url(#arrowlight)"/>
    <path d="M 548 3 C 506 -12 430 -13 366 2" marker-end="url(#arrowlight)"/>
  </g>

  <!-- ============ pipeline boxes ============ -->
  <rect x="16" y="42" width="168" height="40" rx="8" fill="#eaf2fa" stroke="#1f77b4" stroke-width="1.8"/>
  <text x="100" y="67" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f77b4">Sender</text>

  <rect x="352" y="42" width="168" height="40" rx="8" fill="#fdecea" stroke="#e74c3c" stroke-width="1.8"/>
  <text x="436" y="67" text-anchor="middle" font-size="15" font-weight="bold" fill="#c0392b">Network</text>

  <rect x="688" y="42" width="188" height="40" rx="8" fill="#fdf3e7" stroke="#e67e22" stroke-width="2.4"/>
  <text x="774" y="67" text-anchor="middle" font-size="15" font-weight="bold" fill="#b9640f">Receiver</text>
  <g stroke="#b9640f" fill="none" stroke-width="1.5">
    <circle cx="826" cy="62" r="6"/>
    <line x1="826" y1="54.5" x2="826" y2="52.5"/>
    <line x1="823.5" y1="52.5" x2="828.5" y2="52.5"/>
    <line x1="826" y1="62" x2="829" y2="58.5"/>
  </g>

  <!-- sender -> network -->
  <line x1="184" y1="70" x2="348" y2="70" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="266" y="86" text-anchor="middle" font-size="9.5" fill="#555">(p1, t1), (p2, t2), ...</text>
  <text x="266" y="97" text-anchor="middle" font-size="9" fill="#888">t1 &#60; t2 &#60; ...</text>
  <g>
    <rect x="214" y="46" width="18" height="18" rx="4" fill="#dbe9f8" stroke="#1f77b4"/>
    <rect x="238" y="46" width="18" height="18" rx="4" fill="#dbe9f8" stroke="#1f77b4"/>
    <rect x="262" y="46" width="18" height="18" rx="4" fill="#dbe9f8" stroke="#1f77b4"/>
    <rect x="286" y="46" width="18" height="18" rx="4" fill="#dbe9f8" stroke="#1f77b4"/>
    <g font-size="10.5" font-weight="bold" fill="#1f77b4" text-anchor="middle">
      <text x="223" y="59">1</text>
      <text x="247" y="59">2</text>
      <text x="271" y="59">3</text>
      <text x="295" y="59">4</text>
    </g>
  </g>

  <!-- network -> receiver (reordered, one lost) -->
  <line x1="520" y1="70" x2="684" y2="70" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="602" y="86" text-anchor="middle" font-size="9.5" fill="#555">(p2, t2'), (p1, t1'), ...</text>
  <text x="602" y="97" text-anchor="middle" font-size="9" fill="#888">t2' &#60; t1' &#60; ...</text>
  <g>
    <rect x="552" y="46" width="18" height="18" rx="4" fill="#dbe9f8" stroke="#1f77b4"/>
    <rect x="576" y="46" width="18" height="18" rx="4" fill="#dbe9f8" stroke="#1f77b4"/>
    <rect x="600" y="46" width="18" height="18" rx="4" fill="none" stroke="#999" stroke-dasharray="3 2"/>
    <rect x="624" y="46" width="18" height="18" rx="4" fill="#dbe9f8" stroke="#1f77b4"/>
    <g font-size="10.5" font-weight="bold" text-anchor="middle">
      <text x="561" y="59" fill="#1f77b4">2</text>
      <text x="585" y="59" fill="#1f77b4">1</text>
      <text x="609" y="59" fill="#999">3</text>
      <text x="633" y="59" fill="#1f77b4">4</text>
    </g>
  </g>

  <!-- ============ outputs ============ -->
  <g stroke="#555" stroke-width="1.5">
    <line x1="876" y1="56" x2="902" y2="46" marker-end="url(#arrow)"/>
    <line x1="876" y1="70" x2="902" y2="80" marker-end="url(#arrow)"/>
    <line x1="852" y1="102" x2="902" y2="102" marker-end="url(#arrow)"/>
  </g>
  <g font-size="12" fill="#333">
    <text x="908" y="49">latency</text>
    <text x="908" y="83">throughput</text>
    <text x="908" y="105">key misses</text>
  </g>
  <!-- stats collector below the receiver -->
  <line x1="820" y1="82" x2="820" y2="92" stroke="#e67e22" stroke-width="1.4"/>
  <rect x="790" y="92" width="60" height="20" rx="5" fill="#fdf3e7" stroke="#e67e22" stroke-width="1.4"/>
  <text x="820" y="106" text-anchor="middle" font-size="10.5" fill="#b9640f">stats</text>

  <!-- ============ ratchet seed & granularity feedback ============ -->
  <rect x="368" y="98" width="184" height="26" rx="6" fill="#f8f9fa" stroke="#555" stroke-dasharray="5 3"/>
  <text x="460" y="115" text-anchor="middle" font-size="12" fill="#333">ratchet seed, granularity</text>
  <line x1="366" y1="112" x2="104" y2="84" stroke="#555" stroke-dasharray="4 3" marker-end="url(#arrowgray)"/>
  <line x1="554" y1="112" x2="770" y2="84" stroke="#555" stroke-dasharray="4 3" marker-end="url(#arrowgray)"/>
</svg>
